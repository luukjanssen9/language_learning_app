[project]
name = "language-app-backend"
version = "0.1.0"
description = "FastAPI backend for the language learning app"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "greenlet>=3.1",
    "fsrs>=6.3,<7",
    "google-genai>=1.0",
    "google-cloud-texttospeech>=2.16",
    "jieba>=0.42",
    "google-auth>=2.35",
    "pyjwt>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection pattern (`db: AsyncSession = Depends(get_db)`)
# calls Depends() in a default argument by design — not the footgun B008
# otherwise warns about.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]
