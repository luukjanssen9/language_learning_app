services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-language_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-language_app}
      POSTGRES_DB: ${POSTGRES_DB:-language_app}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-language_app}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    env_file: .env
    environment:
      # Overrides the .env file's DATABASE_URL (which points at `localhost`
      # for host-machine dev) — inside the compose network the backend must
      # reach Postgres via its service name instead.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-language_app}:${POSTGRES_PASSWORD:-language_app}@postgres:5432/${POSTGRES_DB:-language_app}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  # frontend:
  #   Added in Phase 3 once frontend/Dockerfile exists (Next.js + Tailwind).
  #   build: ./frontend
  #   env_file: .env
  #   depends_on:
  #     - backend
  #   ports:
  #     - "3000:3000"
  #   volumes:
  #     - ./frontend:/app

volumes:
  pgdata:
