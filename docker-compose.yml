services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-language_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-language_app}
      POSTGRES_DB: ${POSTGRES_DB:-language_app}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-language_app}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    env_file: .env
    environment:
      # Overrides the .env file's DATABASE_URL (which points at `localhost`
      # for host-machine dev) — inside the compose network the backend must
      # reach Postgres via its service name instead.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-language_app}:${POSTGRES_PASSWORD:-language_app}@postgres:5432/${POSTGRES_DB:-language_app}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  # For active development, prefer running the frontend natively
  # (`cd frontend && npm run dev`) instead of via this service — Docker
  # Desktop's bind-mount performance for node_modules/hot-reload is a
  # known-slow path on Windows. This service exists for docker-compose
  # parity/completeness, not as the primary dev workflow.
  frontend:
    build: ./frontend
    environment:
      # Must stay a browser-reachable URL, not the internal compose network
      # hostname -- API calls happen client-side in the browser (see
      # frontend/src/lib/api/client.ts), so the browser (outside the
      # compose network) needs localhost:8000, same as the host-mapped
      # backend port, even though this container is on the network.
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
